apiVersion: v1
kind: Namespace
metadata:
  name: kattle-test
---
# Deployment: web (3 replicas) — realtime update (rollout), scale test
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kattle-test
  labels:
    app: web
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
        ports:
        - containerPort: 80
---
# Deployment: api (2 replicas) — realtime update target
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kattle-test
  labels:
    app: api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: backend
    spec:
      containers:
      - name: api
        image: busybox:1.37
        command: ["sh", "-c", "echo api running && sleep 3600"]
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 20m
            memory: 32Mi
---
# Standalone Pods — individual delete test (2.7)
apiVersion: v1
kind: Pod
metadata:
  name: standalone-a
  namespace: kattle-test
  labels:
    app: standalone
    variant: a
spec:
  containers:
  - name: main
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: standalone-b
  namespace: kattle-test
  labels:
    app: standalone
    variant: b
spec:
  containers:
  - name: main
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: standalone-c
  namespace: kattle-test
  labels:
    app: standalone
    variant: c
spec:
  containers:
  - name: main
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: standalone-d
  namespace: kattle-test
  labels:
    app: standalone
    variant: d
spec:
  containers:
  - name: main
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
---
# Multi-container Pod — field tree exploration (nested containers array)
apiVersion: v1
kind: Pod
metadata:
  name: multi-container
  namespace: kattle-test
  labels:
    app: multi-container
spec:
  containers:
  - name: app
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 64Mi
  - name: sidecar
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 20m
        memory: 32Mi
---
# Rich-metadata Pod — diverse labels/annotations for field tree
apiVersion: v1
kind: Pod
metadata:
  name: rich-metadata
  namespace: kattle-test
  labels:
    app: rich-metadata
    environment: test
    version: v1.2.3
    team: platform
  annotations:
    description: "Pod with rich metadata for field tree testing"
    config-hash: "abc123"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  containers:
  - name: main
    image: busybox:1.37
    command: ["sh", "-c", "sleep 3600"]
    resources:
      requests:
        cpu: 5m
        memory: 8Mi
      limits:
        cpu: 20m
        memory: 32Mi
    env:
    - name: APP_ENV
      value: test
    - name: LOG_LEVEL
      value: debug
---
# ConfigMaps — non-Pod GVK test
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kattle-test
  labels:
    app: web
data:
  app.conf: |
    server.port=8080
    log.level=info
  feature-flags: '{"darkMode":true,"betaAPI":false}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-config
  namespace: kattle-test
  labels:
    app: api
data:
  DATABASE_URL: "postgres://localhost:5432/test"
  CACHE_TTL: "300"
---
# Service — non-Pod GVK test
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: kattle-test
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
